name: CI

# Builds, tests and packages the Linux desktop edition for x64 and arm64, each
# on a native runner: Flutter cannot cross-compile the desktop target, so every
# architecture is built on a machine of that architecture. The snap jobs build
# the amd64 and arm64 snaps the same way. The Android app is built by hand and
# is not part of this workflow.
#
# Every run keeps the packages as workflow artifacts. When a GitHub release is
# published, the release job attaches the Linux tarball of each architecture to
# it, skipping any asset the release already has (so an asset uploaded by hand
# is never replaced, and a release published with notes only is completed).
# The APK is built by hand and is not touched.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The Flutter release SpaceSweep is developed with. There are no Flutter SDK
  # archives for linux-arm64, so every leg installs the SDK the same way: a
  # shallow clone of the release tag.
  FLUTTER_VERSION: '3.44.6'

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            elf_machine: x86-64
          - arch: arm64
            runner: ubuntu-24.04-arm
            elf_machine: ARM aarch64
    env:
      BUNDLE: build/linux/${{ matrix.arch }}/release/bundle
      ELF_MACHINE: ${{ matrix.elf_machine }}
    steps:
      - uses: actions/checkout@v7

      # xvfb, xauth, xdotool, dbus-x11: the smoke run of the packaged app.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            file xvfb xauth xdotool dbus-x11

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Configure Flutter
        run: |
          uname -m
          flutter config --no-analytics --enable-linux-desktop
          flutter precache --linux
          flutter --version
          dart --version

      - name: Get packages
        run: flutter pub get

      # Includes the statvfs-over-FFI disk size test, which reads the real
      # struct layout of this architecture.
      - name: Test
        run: flutter test

      - name: Build release
        run: flutter build linux --release

      - name: Assert every ELF file in the bundle is ${{ matrix.elf_machine }}
        run: |
          for f in space_sweep lib/libapp.so lib/libflutter_linux_gtk.so; do
            [ -f "$BUNDLE/$f" ] || { echo "::error::missing $BUNDLE/$f"; exit 1; }
          done
          checked=0
          bad=0
          while IFS= read -r -d '' f; do
            desc="$(file -b "$f")"
            case "$desc" in ELF*) ;; *) continue ;; esac
            echo "$f: $desc"
            checked=$((checked + 1))
            case "$desc" in
              *"$ELF_MACHINE"*) ;;
              *) echo "::error file=$f::not $ELF_MACHINE"; bad=1 ;;
            esac
          done < <(find "$BUNDLE" -type f -print0)
          echo "checked $checked ELF files"
          [ "$checked" -ge 3 ] && [ "$bad" -eq 0 ]

      - name: Package tarball
        run: packaging/build_tarball.sh dist

      - name: Check the tarball
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          NAME="SpaceSweep-${VERSION}-linux-${{ matrix.arch }}"
          ls -l dist
          [ "$(ls dist | wc -l)" -eq 1 ]
          [ -f "dist/$NAME.tar.gz" ]
          tar -tzf "dist/$NAME.tar.gz" | head -n 20
          tar -xzf "dist/$NAME.tar.gz" -C "$RUNNER_TEMP"
          for f in space_sweep lib/libapp.so lib/libflutter_linux_gtk.so; do
            file "$RUNNER_TEMP/$NAME/$f" | tee /dev/stderr | grep -q "$ELF_MACHINE"
          done
          echo "TARBALL_DIR=$RUNNER_TEMP/$NAME" >> "$GITHUB_ENV"

      # The GTK runner shows the window only once Flutter has rendered its
      # first frame, so a visible "SpaceSweep" window proves the AOT snapshot
      # runs on this architecture. The home screen reads the disk size over
      # FFI while it builds.
      - name: Smoke-run the unpacked tarball (Xvfb)
        timeout-minutes: 5
        run: |
          cat > "$RUNNER_TEMP/smoke.sh" <<'EOF'
          log="$RUNNER_TEMP/smoke.log"
          "$TARBALL_DIR/space_sweep" > "$log" 2>&1 &
          pid=$!
          for i in $(seq 1 90); do
            if xdotool search --onlyvisible --name '^SpaceSweep$' > /dev/null 2>&1; then
              echo "SpaceSweep window is up after ${i}s"
              sleep 5
              kill -0 "$pid" || { echo "space_sweep died after showing its window"; cat "$log"; exit 1; }
              kill "$pid"
              cat "$log"
              exit 0
            fi
            kill -0 "$pid" 2> /dev/null || { echo "space_sweep exited early"; cat "$log"; exit 1; }
            sleep 1
          done
          echo "no SpaceSweep window after 90s"
          cat "$log"
          exit 1
          EOF
          xvfb-run -a -s "-screen 0 1280x800x24" dbus-run-session -- bash "$RUNNER_TEMP/smoke.sh"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  snap:
    name: Snap ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            elf_machine: x86-64
          - arch: arm64
            runner: ubuntu-24.04-arm
            elf_machine: ARM aarch64
    steps:
      - uses: actions/checkout@v7

      - uses: snapcore/action-build@v1
        id: build

      - name: Assert the snap is ${{ matrix.arch }}
        env:
          SNAP_FILE: ${{ steps.build.outputs.snap }}
          ELF_MACHINE: ${{ matrix.elf_machine }}
        run: |
          ls -l "$SNAP_FILE"
          case "$SNAP_FILE" in
            *_${{ matrix.arch }}.snap) ;;
            *) echo "::error::unexpected snap file name $SNAP_FILE"; exit 1 ;;
          esac
          command -v unsquashfs > /dev/null || sudo apt-get install -y squashfs-tools
          unsquashfs -q -d "$RUNNER_TEMP/snap" "$SNAP_FILE"
          sed -n '/^architectures:/,/^[a-z]/p' "$RUNNER_TEMP/snap/meta/snap.yaml"
          grep -qx -- '- ${{ matrix.arch }}' "$RUNNER_TEMP/snap/meta/snap.yaml"
          checked=0
          bad=0
          while IFS= read -r -d '' f; do
            desc="$(file -b "$f")"
            case "$desc" in ELF*) ;; *) continue ;; esac
            checked=$((checked + 1))
            case "$desc" in
              *"$ELF_MACHINE"*) ;;
              *) echo "::error file=$f::not $ELF_MACHINE: $desc"; bad=1 ;;
            esac
          done < <(find "$RUNNER_TEMP/snap" -type f -print0)
          echo "checked $checked ELF files in the snap"
          file "$RUNNER_TEMP/snap/space_sweep" | tee /dev/stderr | grep -q "$ELF_MACHINE"
          [ "$checked" -ge 3 ] && [ "$bad" -eq 0 ]

      # Installs the snap built above (with its gnome content snap) and runs
      # it confined under Xvfb. The personal-files plugs are not connected, so
      # the cache and trash screen is empty; the window still has to come up.
      - name: Install the snap and run it
        timeout-minutes: 15
        env:
          SNAP_FILE: ${{ steps.build.outputs.snap }}
        run: |
          sudo apt-get install -y xvfb xauth xdotool
          sudo snap install --dangerous "$SNAP_FILE"
          snap list
          cat > "$RUNNER_TEMP/snap-smoke.sh" <<'EOF'
          log="$RUNNER_TEMP/snap-smoke.log"
          spacesweep > "$log" 2>&1 &
          pid=$!
          for i in $(seq 1 120); do
            if xdotool search --onlyvisible --name '^SpaceSweep$' > /dev/null 2>&1; then
              echo "SpaceSweep window is up after ${i}s"
              sleep 5
              kill -0 "$pid" || { echo "spacesweep died after showing its window"; cat "$log"; exit 1; }
              kill "$pid"
              cat "$log"
              exit 0
            fi
            kill -0 "$pid" 2> /dev/null || { echo "spacesweep exited early"; cat "$log"; exit 1; }
            sleep 1
          done
          echo "no SpaceSweep window after 120s"
          cat "$log"
          exit 1
          EOF
          xvfb-run -a -s "-screen 0 1280x800x24 -ac" bash "$RUNNER_TEMP/snap-smoke.sh"

      - uses: actions/upload-artifact@v7
        with:
          name: snap-${{ matrix.arch }}
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error

  release:
    name: Release assets
    needs: [linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: pubspec.yaml
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          pattern: 'linux-*'
          path: assets
          merge-multiple: true

      - name: Select the release assets
        id: select
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          FILES="assets/SpaceSweep-${VERSION}-linux-x64.tar.gz assets/SpaceSweep-${VERSION}-linux-arm64.tar.gz"
          ls -l assets
          ls -l $FILES
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Upload to release ${{ github.event.release.tag_name }}
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.select.outputs.version }}
          FILES: ${{ steps.select.outputs.files }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::release tag $TAG does not match pubspec.yaml version $VERSION"
            exit 1
          fi
          # Attach what the release lacks. An asset that is already there
          # (built and uploaded by hand) is left exactly as it is.
          existing="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for f in $FILES; do
            if grep -qxF -- "$(basename "$f")" <<< "$existing"; then
              echo "$(basename "$f") is already on release $TAG, skipping"
            else
              gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY"
            fi
          done
