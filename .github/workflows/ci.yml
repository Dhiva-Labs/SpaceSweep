name: CI

# Builds, tests and packages the Linux desktop edition for x64 and arm64, each
# on a native runner: Flutter cannot cross-compile the desktop target, so every
# architecture is built on a machine of that architecture. The snap jobs build
# the amd64 and arm64 snaps the same way. The Android app is built by hand and
# is not part of this workflow.
#
# The distros, aur and flatpak jobs turn the same tarball into an installed
# tree (packaging/linux-distros/make-tree.sh) and package it for Fedora/RHEL/
# openSUSE (.rpm), Arch (.pkg.tar.zst and the AUR PKGBUILD), any glibc
# distribution (AppImage) and Flatpak, then install and run each one on the
# real distribution.
#
# Every run keeps the packages as workflow artifacts. When a GitHub release is
# published, the release job attaches the Linux packages of each architecture
# to it, skipping any asset the release already has (so an asset uploaded by
# hand is never replaced, and a release published with notes only is
# completed). The APK is built by hand and is not touched.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The Flutter release SpaceSweep is developed with. There are no Flutter SDK
  # archives for linux-arm64, so every leg installs the SDK the same way: a
  # shallow clone of the release tag.
  FLUTTER_VERSION: '3.44.6'

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            elf_machine: x86-64
          - arch: arm64
            runner: ubuntu-24.04-arm
            elf_machine: ARM aarch64
    env:
      BUNDLE: build/linux/${{ matrix.arch }}/release/bundle
      ELF_MACHINE: ${{ matrix.elf_machine }}
    steps:
      - uses: actions/checkout@v7

      # xvfb, xauth, xdotool, dbus-x11: the smoke run of the packaged app.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            file xvfb xauth xdotool dbus-x11

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Configure Flutter
        run: |
          uname -m
          flutter config --no-analytics --enable-linux-desktop
          flutter precache --linux
          flutter --version
          dart --version

      - name: Get packages
        run: flutter pub get

      # Includes the statvfs-over-FFI disk size test, which reads the real
      # struct layout of this architecture.
      - name: Test
        run: flutter test

      - name: Build release
        run: flutter build linux --release

      - name: Assert every ELF file in the bundle is ${{ matrix.elf_machine }}
        run: |
          for f in space_sweep lib/libapp.so lib/libflutter_linux_gtk.so; do
            [ -f "$BUNDLE/$f" ] || { echo "::error::missing $BUNDLE/$f"; exit 1; }
          done
          checked=0
          bad=0
          while IFS= read -r -d '' f; do
            desc="$(file -b "$f")"
            case "$desc" in ELF*) ;; *) continue ;; esac
            echo "$f: $desc"
            checked=$((checked + 1))
            case "$desc" in
              *"$ELF_MACHINE"*) ;;
              *) echo "::error file=$f::not $ELF_MACHINE"; bad=1 ;;
            esac
          done < <(find "$BUNDLE" -type f -print0)
          echo "checked $checked ELF files"
          [ "$checked" -ge 3 ] && [ "$bad" -eq 0 ]

      - name: Package tarball
        run: packaging/build_tarball.sh dist

      - name: Check the tarball
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          NAME="SpaceSweep-${VERSION}-linux-${{ matrix.arch }}"
          ls -l dist
          [ "$(ls dist | wc -l)" -eq 1 ]
          [ -f "dist/$NAME.tar.gz" ]
          tar -tzf "dist/$NAME.tar.gz" | head -n 20
          tar -xzf "dist/$NAME.tar.gz" -C "$RUNNER_TEMP"
          for f in space_sweep lib/libapp.so lib/libflutter_linux_gtk.so; do
            file "$RUNNER_TEMP/$NAME/$f" | tee /dev/stderr | grep -q "$ELF_MACHINE"
          done
          echo "TARBALL_DIR=$RUNNER_TEMP/$NAME" >> "$GITHUB_ENV"

      # The GTK runner shows the window only once Flutter has rendered its
      # first frame, so a visible "SpaceSweep" window proves the AOT snapshot
      # runs on this architecture. The home screen reads the disk size over
      # FFI while it builds.
      - name: Smoke-run the unpacked tarball (Xvfb)
        timeout-minutes: 5
        run: |
          cat > "$RUNNER_TEMP/smoke.sh" <<'EOF'
          log="$RUNNER_TEMP/smoke.log"
          "$TARBALL_DIR/space_sweep" > "$log" 2>&1 &
          pid=$!
          for i in $(seq 1 90); do
            if xdotool search --onlyvisible --name '^SpaceSweep$' > /dev/null 2>&1; then
              echo "SpaceSweep window is up after ${i}s"
              sleep 5
              kill -0 "$pid" || { echo "space_sweep died after showing its window"; cat "$log"; exit 1; }
              kill "$pid"
              cat "$log"
              exit 0
            fi
            kill -0 "$pid" 2> /dev/null || { echo "space_sweep exited early"; cat "$log"; exit 1; }
            sleep 1
          done
          echo "no SpaceSweep window after 90s"
          cat "$log"
          exit 1
          EOF
          xvfb-run -a -s "-screen 0 1280x800x24" dbus-run-session -- bash "$RUNNER_TEMP/smoke.sh"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  snap:
    name: Snap ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            elf_machine: x86-64
          - arch: arm64
            runner: ubuntu-24.04-arm
            elf_machine: ARM aarch64
    steps:
      - uses: actions/checkout@v7

      - uses: snapcore/action-build@v1
        id: build

      - name: Assert the snap is ${{ matrix.arch }}
        env:
          SNAP_FILE: ${{ steps.build.outputs.snap }}
          ELF_MACHINE: ${{ matrix.elf_machine }}
        run: |
          ls -l "$SNAP_FILE"
          case "$SNAP_FILE" in
            *_${{ matrix.arch }}.snap) ;;
            *) echo "::error::unexpected snap file name $SNAP_FILE"; exit 1 ;;
          esac
          command -v unsquashfs > /dev/null || sudo apt-get install -y squashfs-tools
          unsquashfs -q -d "$RUNNER_TEMP/snap" "$SNAP_FILE"
          sed -n '/^architectures:/,/^[a-z]/p' "$RUNNER_TEMP/snap/meta/snap.yaml"
          grep -qx -- '- ${{ matrix.arch }}' "$RUNNER_TEMP/snap/meta/snap.yaml"
          checked=0
          bad=0
          while IFS= read -r -d '' f; do
            desc="$(file -b "$f")"
            case "$desc" in ELF*) ;; *) continue ;; esac
            checked=$((checked + 1))
            case "$desc" in
              *"$ELF_MACHINE"*) ;;
              *) echo "::error file=$f::not $ELF_MACHINE: $desc"; bad=1 ;;
            esac
          done < <(find "$RUNNER_TEMP/snap" -type f -print0)
          echo "checked $checked ELF files in the snap"
          file "$RUNNER_TEMP/snap/space_sweep" | tee /dev/stderr | grep -q "$ELF_MACHINE"
          [ "$checked" -ge 3 ] && [ "$bad" -eq 0 ]

      # Installs the snap built above (with its gnome content snap) and runs
      # it confined under Xvfb. The personal-files plugs are not connected, so
      # the cache and trash screen is empty; the window still has to come up.
      - name: Install the snap and run it
        timeout-minutes: 15
        env:
          SNAP_FILE: ${{ steps.build.outputs.snap }}
        run: |
          sudo apt-get install -y xvfb xauth xdotool
          sudo snap install --dangerous "$SNAP_FILE"
          snap list
          cat > "$RUNNER_TEMP/snap-smoke.sh" <<'EOF'
          log="$RUNNER_TEMP/snap-smoke.log"
          spacesweep > "$log" 2>&1 &
          pid=$!
          for i in $(seq 1 120); do
            if xdotool search --onlyvisible --name '^SpaceSweep$' > /dev/null 2>&1; then
              echo "SpaceSweep window is up after ${i}s"
              sleep 5
              kill -0 "$pid" || { echo "spacesweep died after showing its window"; cat "$log"; exit 1; }
              kill "$pid"
              cat "$log"
              exit 0
            fi
            kill -0 "$pid" 2> /dev/null || { echo "spacesweep exited early"; cat "$log"; exit 1; }
            sleep 1
          done
          echo "no SpaceSweep window after 120s"
          cat "$log"
          exit 1
          EOF
          xvfb-run -a -s "-screen 0 1280x800x24 -ac" bash "$RUNNER_TEMP/snap-smoke.sh"

      - uses: actions/upload-artifact@v7
        with:
          name: snap-${{ matrix.arch }}
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error

  # Builds the installed tree from each architecture's tarball and packages
  # it for Fedora/RHEL/openSUSE (.rpm), Arch (.pkg.tar.zst) and any glibc
  # distribution (AppImage), then installs every one of them on the real
  # distribution and runs it.
  distros:
    name: Other distros ${{ matrix.arch }}
    needs: [linux]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, deb_arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, deb_arch: arm64, runner: ubuntu-24.04-arm }
    env:
      NFPM_VERSION: '2.48.0'
      APPIMAGETOOL_VERSION: '1.9.1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: linux-${{ matrix.arch }}
          path: tarball

      - name: Install nfpm and appimagetool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$(uname -m)" in
            x86_64) nfpm_arch=x86_64; ai_arch=x86_64 ;;
            aarch64) nfpm_arch=arm64; ai_arch=aarch64 ;;
          esac
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/bin"
          tarball="nfpm_${NFPM_VERSION}_Linux_${nfpm_arch}.tar.gz"
          gh release download "v$NFPM_VERSION" -R goreleaser/nfpm -p "$tarball" -p checksums.txt
          grep " $tarball\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" nfpm
          gh release download "$APPIMAGETOOL_VERSION" -R AppImage/appimagetool \
            -p "appimagetool-$ai_arch.AppImage" -O appimagetool
          chmod +x appimagetool
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # TREE_TARBALL: the AppImage's tree, for the Flatpak job; tar keeps
      # modes and symlinks, which a plain artifact upload would drop.
      - name: Build .rpm, Arch package and AppImage
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          packaging/linux-distros/make-tree.sh \
            "tarball/SpaceSweep-${VERSION}-linux-${{ matrix.arch }}.tar.gz" "$RUNNER_TEMP/root"
          VERSION="$VERSION" TREE_TARBALL="$RUNNER_TEMP/tree.tar" \
            packaging/linux-distros/pack.sh "$RUNNER_TEMP/root" ${{ matrix.deb_arch }} dist

      - name: Install and run on Fedora, openSUSE and Arch
        run: packaging/linux-distros/verify.sh dist ${{ matrix.deb_arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: distros-${{ matrix.arch }}
          path: |
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.AppImage
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: tree-${{ matrix.arch }}
          path: ${{ runner.temp }}/tree.tar
          if-no-files-found: error
          retention-days: 3

  # AUR recipe: PKGBUILD + .SRCINFO for spacesweep-bin (from the release
  # tarballs), rendered with this build's checksums and proven with makepkg
  # on archlinux:latest.
  aur:
    name: AUR PKGBUILD
    needs: [linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: 'linux-*'
          path: tarballs
          merge-multiple: true

      - name: Render and check the PKGBUILD
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          VERSION="$VERSION" packaging/arch/aur.sh \
            "tarballs/SpaceSweep-${VERSION}-linux-x64.tar.gz" \
            "tarballs/SpaceSweep-${VERSION}-linux-arm64.tar.gz" dist

      - uses: actions/upload-artifact@v7
        with:
          name: aur
          path: dist/*-aur.tar.gz
          if-no-files-found: error

  # Builds the Flatpak bundle from the distros job's tree, installs it in the
  # builder container and runs it there.
  flatpak:
    name: Flatpak ${{ matrix.arch }}
    needs: [distros]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, fp_arch: x86_64, runner: ubuntu-24.04 }
          - { arch: arm64, fp_arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: tree-${{ matrix.arch }}
          path: ${{ runner.temp }}

      - name: Unpack the installed tree
        id: v
        run: |
          mkdir -p packaging/flatpak/tree
          tar -xf "$RUNNER_TEMP/tree.tar" -C packaging/flatpak/tree
          echo "version=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)" >> "$GITHUB_OUTPUT"

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/com.dhivalabs.space_sweep.yml
          bundle: spacesweep-${{ steps.v.outputs.version }}-${{ matrix.fp_arch }}.flatpak
          arch: ${{ matrix.fp_arch }}
          artifact-name: flatpak-${{ matrix.arch }}
          cache: false

      - name: Install the bundle and run it
        run: |
          packaging/flatpak/test-bundle.sh \
            spacesweep-${{ steps.v.outputs.version }}-${{ matrix.fp_arch }}.flatpak \
            com.dhivalabs.space_sweep '^SpaceSweep$'

  release:
    name: Release assets
    needs: [linux, distros, aur, flatpak]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: pubspec.yaml
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          pattern: 'linux-*'
          path: assets
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: 'distros-*'
          path: assets
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: aur
          path: assets

      - uses: actions/download-artifact@v8
        with:
          pattern: 'flatpak-*'
          path: assets
          merge-multiple: true

      - name: Select the release assets
        id: select
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          FILES="assets/SpaceSweep-${VERSION}-linux-x64.tar.gz assets/SpaceSweep-${VERSION}-linux-arm64.tar.gz"
          for a in x86_64 aarch64; do
            FILES="$FILES assets/spacesweep-${VERSION}-1.${a}.rpm"
            FILES="$FILES assets/spacesweep-${VERSION}-1-${a}.pkg.tar.zst"
            FILES="$FILES assets/SpaceSweep-${VERSION}-${a}.AppImage"
            FILES="$FILES assets/spacesweep-${VERSION}-${a}.flatpak"
          done
          FILES="$FILES assets/spacesweep-bin-${VERSION}-aur.tar.gz"
          ls -l assets
          ls -l $FILES
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Upload to release ${{ github.event.release.tag_name }}
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.select.outputs.version }}
          FILES: ${{ steps.select.outputs.files }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::release tag $TAG does not match pubspec.yaml version $VERSION"
            exit 1
          fi
          # Attach what the release lacks. An asset that is already there
          # (built and uploaded by hand) is left exactly as it is.
          existing="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for f in $FILES; do
            if grep -qxF -- "$(basename "$f")" <<< "$existing"; then
              echo "$(basename "$f") is already on release $TAG, skipping"
            else
              gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY"
            fi
          done
