# Package metadata for the other-distribution packages (.rpm, Arch, AppImage,
# AUR PKGBUILD). Sourced by bash from packaging/linux-distros/pack.sh,
# verify.sh and packaging/arch/aur.sh. SpaceSweep has no .deb: make-tree.sh
# builds the installed tree from the release tarball.

NAME=spacesweep
APP_NAME=SpaceSweep
GITHUB_REPO=Dhiva-Labs/SpaceSweep
TAG_PREFIX=v
SUMMARY='Find duplicate files, clear app caches and empty the trash'
DESCRIPTION='SpaceSweep frees up disk space without guesswork: it finds duplicate, junk and large files in your Desktop, Documents, Downloads, Music, Pictures and Videos folders, lists every folder in ~/.cache by size to clear, and empties the desktop trash. Everything runs on your computer: no ads, no tracking, no network access.'
MAINTAINER='Dhiva Labs <dhivakar1010@gmail.com>'
HOMEPAGE=https://github.com/Dhiva-Labs/SpaceSweep
# The snap declares the licence as Proprietary and the repository has no
# licence file.
LICENSE=LicenseRef-Proprietary
LICENSE_FILE=''

EXCLUDE=()
PACKAGE_EXCLUDE=()

# The AUR package repackages the release tarball, which holds only the
# Flutter bundle; the desktop file and the icon come from the repository at
# the release tag.
AUR_SOURCES=(packaging/linux/spacesweep.desktop snap/gui/spacesweep.png)

# rpm: shared-library dependencies are worked out from the ELF files.
# Flutter dlopens libEGL.so.1 and libGLESv2.so.2 (libepoxy), so they are no
# NEEDED entries; the rpm requires the sonames (libglvnd on Fedora, Mesa's
# libEGL1/libGLESv2-2 on openSUSE) and Arch gets libglvnd. Without them a
# minimal Fedora aborts at start with "Couldn't open libGLESv2.so.2".
RPM_REQUIRES=('libEGL.so.1()(64bit)' 'libGLESv2.so.2()(64bit)')
ARCH_DEPENDS=(gtk3 libglvnd)
ARCH_INDEPENDENT=0

APPIMAGE=1
EXEC=usr/lib/spacesweep/space_sweep
DESKTOP=usr/share/applications/spacesweep.desktop
ICON=usr/share/icons/hicolor/512x512/apps/spacesweep.png
APPRUN_ENV=''
# What the AppImage expects from the host: GTK 3 and the dlopened EGL/GLES 2
# (every desktop has them; Fedora's container image does not).
APPIMAGE_HOST_PACKAGES_FEDORA='gtk3 libglvnd-egl libglvnd-gles'

# Smoke test in each distribution container. The GTK runner shows its window
# only after Flutter rendered the first frame, and the home screen reads the
# disk size over FFI (statvfs) while it builds, so a visible "SpaceSweep"
# window proves the AOT snapshot ran.
GUI_CMD=spacesweep
GUI_WINDOW='^SpaceSweep$'
SMOKE_SECONDS=90
SMOKE_CMD=''
